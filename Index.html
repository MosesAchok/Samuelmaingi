
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KENYA / NOW - Make Your Move</title>
    <!-- Google Fonts for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080C10;
            --accent-green: #00FF85;
            --accent-green-glow: rgba(0, 255, 133, 0.35);
            --text-white: #FFFFFF;
            --text-muted: #8A99AD;
            --border-color: rgba(0, 255, 133, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Background decorative ripple circles */
        .bg-circles {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .circle {
            position: absolute;
            border: 1px solid rgba(0, 255, 133, 0.08);
            border-radius: 50%;
        }

        .circle-1 {
            width: 600px;
            height: 600px;
            bottom: -200px;
            right: -150px;
        }

        .circle-2 {
            width: 400px;
            height: 400px;
            bottom: -100px;
            right: -50px;
            border-color: rgba(0, 255, 133, 0.12);
        }

        .circle-3 {
            width: 800px;
            height: 800px;
            top: -300px;
            left: -300px;
        }

        /* Mobile Container Frame mimicking a phone wrapper or clean full-screen view */
        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 850px;
            background: linear-gradient(180deg, #0A0F14 0%, #050709 100%);
            border: 1px solid rgba(255, 255, 133, 0.05);
            border-radius: 36px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 32px 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 
                        0 0 40px rgba(0, 255, 133, 0.03);
            overflow: hidden;
        }

        @media (max-width: 480px) {
            .container {
                height: 100vh;
                max-height: none;
                border-radius: 0;
                border: none;
            }
        }

        /* Header Section */
        header {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .brand-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 2px;
            color: var(--text-white);
        }

        .brand-row span.slash {
            color: var(--text-muted);
            font-weight: 400;
        }

        .moment-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .pulse-dot {
            width: 6px;
            height: 6px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 133, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(0, 255, 133, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 133, 0); }
        }

        /* Main Content Section */
        main {
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin: auto 0;
            padding: 20px 0;
        }

        .tagline-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .tagline-badge::before,
        .tagline-badge::after {
            content: '';
            height: 1px;
            width: 32px;
            background: linear-gradient(90deg, transparent, var(--accent-green));
        }

        .tagline-badge::after {
            background: linear-gradient(90deg, var(--accent-green), transparent);
        }

        .tagline-badge span {
            font-family: 'Outfit', sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2.5px;
            color: var(--accent-green);
            text-transform: uppercase;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 44px;
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -1px;
            text-align: center;
            margin-bottom: 32px;
        }

        h1 .highlight {
            color: var(--accent-green);
            text-shadow: 0 0 25px rgba(0, 255, 133, 0.25);
        }

        /* Interactive Start Button */
        .start-btn-wrapper {
            position: relative;
            width: 100%;
        }

        .start-btn {
            width: 100%;
            background-color: var(--accent-green);
            color: #05080A;
            border: none;
            border-radius: 14px;
            padding: 18px 24px;
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 8px 25px var(--accent-green-glow);
            transition: all 0.3s ease;
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(0, 255, 133, 0.45);
            background-color: #1aff94;
        }

        .start-btn:active {
            transform: translateY(0);
        }

        .arrow-box {
            background-color: #05080A;
            color: var(--accent-green);
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        .start-btn:hover .arrow-box {
            transform: translate(2px, -2px);
        }

        /* Footer Section */
        footer {
            text-align: center;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* Simple Modal for JavaScript action */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 8, 10, 0.85);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #0D131A;
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 320px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-card h3 {
            font-family: 'Outfit', sans-serif;
            font-size: 22px;
            margin-bottom: 10px;
            color: var(--text-white);
        }

        .modal-card p {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .close-modal-btn {
            background: transparent;
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .close-modal-btn:hover {
            background: rgba(0, 255, 133, 0.1);
        }
    </style>
</head>
<body>

    <!-- Background Ripple Circles -->
    <div class="bg-circles">
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>
    </div>

    <!-- Main Phone Frame Container -->
    <div class="container">
        <!-- Header -->
        <header>
            <div class="brand-row">
                KENYA <span class="slash">/</span> NOW
            </div>
            <div class="moment-indicator">
                <div class="pulse-dot"></div>
                Your moment is now
            </div>
        </header>

        <!-- Main Center Copy -->
        <main>
            <div class="tagline-badge">
                <span>Make Your Move</span>
            </div>
            
            <h1>
                Here is<br>
                Your Way to<br>
                <span class="highlight">Win. Now.</span>
            </h1>

            <div class="start-btn-wrapper">
                <button class="start-btn" id="startBtn">
                    <span>Start</span>
                    <div class="arrow-box">
                        <!-- Diagonal Arrow SVG Icon -->
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="7" y1="17" x2="17" y2="7"></line>
                            <polyline points="7 7 17 7 17 17"></polyline>
                        </svg>
                    </div>
                </button>
            </div>
        </main>

        <!-- Footer -->
        <footer>
            A new moment starts here
        </footer>
    </div>

    <!-- Interactive Popup Modal (Triggered by JS on Start Click) -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <h3>Welcome to Kenya Now</h3>
            <p>Your journey has been initialized. Edit this JavaScript logic or link to connect your app backend or destination route.</p>
            <button class="close-modal-btn" id="closeModalBtn">Continue</button>
        </div>
    </div>

    <!-- JavaScript Interaction Logic -->
    <script>
        const startBtn = document.getElementById('startBtn');
        const modalOverlay = document.getElementById('modalOverlay');
        const closeModalBtn = document.getElementById('closeModalBtn');

        // Open modal or handle navigation when 'START' is clicked
        startBtn.addEventListener('click', () => {
            modalOverlay.classList.add('active');
        });

        // Close modal
        closeModalBtn.addEventListener('click', () => {
            modalOverlay.classList.remove('active');
        });

        // Close modal when clicking outside the card
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                modalOverlay.classList.remove('active');
            }
        });
    </script>
</body>
</html>
